[project]
name = "aigc-pipeline-workbench-mock-services"
version = "0.1.0"
description = "Mock GPU microservices for the AIGC workbench"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "mypy>=1.11.0",
  "anyio>=4.12.1",
  "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
