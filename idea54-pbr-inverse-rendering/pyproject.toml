[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idea54-pbr-inverse-rendering"
version = "0.1.0"
description = "Geometry-frozen, bounded PBR inverse rendering with low-dimensional lighting."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Idea 5.4 contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
cuda = ["nvdiffrast @ git+https://github.com/NVlabs/nvdiffrast.git"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
idea54 = "idea54.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and nvdiffrast"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E402"]
